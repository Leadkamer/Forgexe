<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oefeningen · Juridische AI-training</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/forgexe-mark-green.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #1B2A55; --navy-deep: #111D3E; --navy-light: #2A3E6E;
    --green: #34d399; --green-bright: #4ade80; --green-pale: #E6F9F1;
    --sky: #EEF2F9; --cloud: #F6F8FC; --white: #FFFFFF;
    --slate: #4A5568; --slate-light: #718096; --ink: #1A1F2E; --border: #DEE5F0;
    --red: #C0392B; --red-pale: #FCEDEB; --amber: #A86A00; --amber-pale: #FDF3E1;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Outfit', sans-serif; color: var(--ink); background: var(--cloud); -webkit-font-smoothing: antialiased; line-height: 1.5; font-size: 16px; overflow-x: hidden; }
  h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; color: var(--navy-deep); line-height: 1.2; font-weight: 600; }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--navy); }
  .verborgen { display: none !important; }

  /* Kop */
  .kop { background: var(--navy-deep); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 50; }
  .kop-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .kop-merk { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.7); font-weight: 500; }
  .kop-merk b { color: var(--green); font-weight: 600; }
  .kop-rechts { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: rgba(255,255,255,.8); }
  .kop-rechts button { background: none; border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .tabs { max-width: 1080px; margin: 10px auto 0; display: flex; gap: 6px; overflow-x: auto; }
  .tab { background: rgba(255,255,255,.08); border: 0; color: rgba(255,255,255,.75); padding: 8px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 500; white-space: nowrap; font-size: 15px; }
  .tab.actief { background: var(--cloud); color: var(--navy-deep); }

  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 80px; }
  .kaart { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .kaart h2 { font-size: 22px; margin-bottom: 6px; }
  .kaart h3 { font-size: 18px; margin: 14px 0 6px; }
  .stap { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--slate-light); font-weight: 600; margin-bottom: 4px; }
  .uitleg { color: var(--slate); font-size: 15px; margin-bottom: 12px; }
  .klein { font-size: 13px; color: var(--slate-light); }

  /* Formulier */
  label.veld { display: block; font-weight: 500; font-size: 14px; color: var(--navy); margin: 12px 0 4px; }
  input[type=text], input[type=password], textarea, select { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: #fff; font-size: 16px; }
  textarea { min-height: 76px; resize: vertical; }
  textarea.groot { min-height: 220px; font-size: 14px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--green); outline-offset: 0; border-color: var(--green); }
  .knop { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--green); color: var(--navy-deep); border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 600; cursor: pointer; font-size: 16px; }
  .knop:hover { background: var(--green-bright); }
  .knop.twee { background: var(--white); border: 1px solid var(--border); color: var(--navy); }
  .knop.twee:hover { background: var(--sky); }
  .knop.klein { padding: 6px 12px; font-size: 14px; }
  .knop.rood { background: var(--white); border: 1px solid #E8C4BF; color: var(--red); }
  .fout { background: var(--red-pale); color: var(--red); border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border); background: #fff; color: var(--navy); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 15px; font-weight: 500; }
  .chip:hover { border-color: var(--navy-light); }
  .chip.aan { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip.bezet { opacity: .55; }
  .chip small { font-weight: 400; opacity: .8; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .seg button { border: 0; background: #fff; padding: 7px 12px; cursor: pointer; font-size: 14px; color: var(--slate); border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: 0; }
  .seg button.aan.goed { background: var(--green-pale); color: #116b4a; font-weight: 600; }
  .seg button.aan.mis { background: var(--red-pale); color: var(--red); font-weight: 600; }
  .seg button.aan.half { background: var(--amber-pale); color: var(--amber); font-weight: 600; }

  /* Vragen */
  .vraag { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--sky); }
  .vraag:first-child { border-top: 0; }
  .vraag .nr { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--green); font-size: 20px; min-width: 22px; line-height: 1.2; }
  .vraag .tekst { flex: 1; }
  .kopieer { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--navy); white-space: nowrap; }
  .prompt { background: var(--cloud); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; white-space: pre-wrap; flex: 1; }

  /* Arresten */
  .arrest { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 12px; background: #fff; }
  .arrest-kop { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .arrest-kop b { color: var(--navy); }
  .rij2 { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  .check { background: var(--cloud); border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
  .checkrij { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 0; flex-wrap: wrap; }
  .checkrij span { font-size: 14px; color: var(--navy); font-weight: 500; }
  .weg { border: 0; background: none; color: var(--slate-light); cursor: pointer; font-size: 13px; text-decoration: underline; }

  .status { position: fixed; right: 12px; bottom: 12px; background: var(--navy-deep); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 60; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .status.ok { background: #116b4a; }
  .status.mis { background: var(--red); }

  /* Envelop */
  .envelop-dicht { text-align: center; padding: 26px 10px; }
  .envelop-dicht svg { margin-bottom: 8px; }
  .env h2 { font-size: 22px; margin: 18px 0 4px; }
  .env h3 { font-size: 17px; margin: 16px 0 6px; }
  .env p, .env li { font-size: 15px; margin: 6px 0; }
  .env ul, .env ol { padding-left: 20px; }
  .env-deel { border-top: 2px solid var(--green); margin-top: 20px; padding-top: 4px; }
  .env-deel:first-child { margin-top: 0; }
  .env-sub { color: var(--slate-light); font-size: 14px !important; }
  .legenda { background: var(--cloud); border-radius: 8px; padding: 8px 10px; font-size: 13.5px !important; }
  .tblwrap, .tbl { overflow-x: auto; margin: 8px 0; -webkit-overflow-scrolling: touch; }
  .env table, .sleutel table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 13.5px; }
  .env th, .env td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  .env th { background: var(--sky); }
  .env a.ecli { white-space: nowrap; }
  .env p, .env li, .blok p { overflow-wrap: anywhere; }
  .pres .bal span, .pres .klein { font-size: clamp(14px, 1.4vw, 22px); color: rgba(255,255,255,.75); }
  .tab .kort { display: none; }
  @media (max-width: 599px) { .tab .lang { display: none; } .tab .kort { display: inline; } .tab { padding: 8px 12px; } }
  .env .copy, .env .mk { display: none; }

  /* Trainer */
  .balk { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .stappen { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; }
  .stapknop { flex: none; border: 1px solid var(--border); background: #fff; color: var(--navy); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .stapknop.nu { background: var(--navy); border-color: var(--navy); color: #fff; }
  .stapknop:disabled { opacity: .45; cursor: default; }
  .stap-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 4px 0 24px; }
  .balk select { width: auto; }
  .codeblok { background: var(--navy-deep); color: #fff; border-radius: 12px; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; }
  .codeblok .url { font-size: 18px; color: rgba(255,255,255,.8); }
  .codeblok .code { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; color: var(--green); letter-spacing: .04em; }
  .schakel { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer; font-weight: 600; color: var(--navy); }
  .schakel i { width: 38px; height: 22px; border-radius: 999px; background: #CBD3E1; position: relative; display: inline-block; transition: background .2s; }
  .schakel i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; }
  .schakel.aan i { background: var(--green); }
  .schakel.aan i::after { left: 19px; }
  .tellers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .teller { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .teller b { display: block; font-family: 'Playfair Display', serif; font-size: 30px; color: var(--navy-deep); line-height: 1.1; }
  .teller span { font-size: 13.5px; color: var(--slate); }
  .teller.mis b { color: var(--red); }
  .teller.half b { color: var(--amber); }
  .teller.goed b { color: #116b4a; }
  .groepkaart { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 14px; }
  .groepkaart-kop { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
  .groepkaart h3 { font-size: 20px; margin: 0; }
  .label { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--slate-light); }
  .blok { margin-top: 12px; }
  .blok p { white-space: pre-wrap; }
  .lijst { width: 100%; border-collapse: collapse; font-size: 14px; }
  .lijst th, .lijst td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--sky); vertical-align: top; }
  .lijst th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--slate-light); font-weight: 600; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tag { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 600; margin: 1px 2px 1px 0; white-space: nowrap; }
  .tag.goed { background: var(--green-pale); color: #116b4a; }
  .tag.mis { background: var(--red-pale); color: var(--red); }
  .tag.half { background: var(--amber-pale); color: var(--amber); }
  .tag.leeg { background: var(--sky); color: var(--slate); }
  .balken { margin-top: 6px; }
  .bal { display: grid; grid-template-columns: 110px 1fr 34px; gap: 8px; align-items: center; font-size: 14px; margin: 5px 0; }
  .bal .spoor { background: var(--sky); border-radius: 4px; height: 14px; overflow: hidden; }
  .bal .vul { height: 100%; background: var(--navy); border-radius: 4px; }
  details.uitklap { margin-top: 10px; }
  details.uitklap summary { cursor: pointer; color: var(--navy); font-weight: 500; }
  .naast { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .naast pre { white-space: pre-wrap; font-family: inherit; font-size: 14px; background: var(--cloud); border-radius: 8px; padding: 12px; max-height: 520px; overflow: auto; }
  .sleutel { background: var(--green-pale); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .sleutel h3 { font-size: 16px; margin: 8px 0 4px; }
  .sleutel ul { padding-left: 20px; font-size: 14.5px; }

  /* Presenteren */
  .pres { position: fixed; inset: 0; background: var(--navy-deep); color: #fff; z-index: 200; display: flex; flex-direction: column; }
  .pres-in { flex: 1; overflow: auto; padding: 4vh 5vw; }
  .pres h1 { color: #fff; font-size: clamp(28px, 4vw, 54px); margin-bottom: 2vh; }
  .pres h2 { color: var(--green); font-size: clamp(20px, 2.4vw, 32px); margin: 3vh 0 1vh; }
  .pres p, .pres li, .pres td, .pres th { font-size: clamp(16px, 1.7vw, 26px); }
  .pres .p-kicker { font-size: clamp(13px, 1.1vw, 18px); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  .pres .tellers { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .pres .teller { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.15); }
  .pres .teller b { color: #fff; font-size: clamp(34px, 4.4vw, 64px); }
  .pres .teller span { color: rgba(255,255,255,.75); font-size: clamp(14px, 1.3vw, 20px); }
  .pres .teller.mis b { color: #FF8A7A; }
  .pres .teller.half b { color: #F5C26B; }
  .pres .teller.goed b { color: var(--green); }
  .pres .lijst th { color: rgba(255,255,255,.55); }
  .pres .lijst td, .pres .lijst th { border-color: rgba(255,255,255,.12); padding: 1vh 10px; }
  .pres .tag.leeg { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); }
  .pres .citaat { background: rgba(255,255,255,.06); border-radius: 10px; padding: 1.4vh 22px; margin: 1.5vh 0; white-space: pre-wrap; }
  .pres-voet { display: flex; justify-content: space-between; align-items: center; padding: 12px 5vw; border-top: 1px solid rgba(255,255,255,.12); font-size: 14px; color: rgba(255,255,255,.6); }
  .pres-voet button { background: rgba(255,255,255,.1); border: 0; color: #fff; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 15px; }
  .pres .bal .spoor { background: rgba(255,255,255,.1); }
  .pres .bal .vul { background: var(--green); }
  .pres .bal { grid-template-columns: 200px 1fr 50px; }

  .login { max-width: 460px; margin: 6vh auto 0; }
  .login h1 { font-size: 30px; margin-bottom: 6px; }
  .merkregel { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; color: var(--slate); font-size: 14px; }
  .merkregel img { width: 28px; height: 28px; }

  /* Hand-outs */
  .ho-lijst { display: grid; grid-template-columns: 1fr; gap: 10px; }
  a.ho-kaart, a.knop { text-decoration: none; color: inherit; }
  a.knop { color: var(--navy-deep); }
  .ho-kaart { display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; width: 100%; }
  .ho-kaart:hover { border-color: var(--navy-light); }
  .ho-nr { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--green); font-size: 22px; min-width: 26px; line-height: 1.2; }
  .ho-tekst { flex: 1; display: flex; flex-direction: column; }
  .ho-tekst b { color: var(--navy-deep); font-size: 16px; }
  .ho-tekst span { color: var(--slate); font-size: 14px; }
  .ho-tekst-blok blockquote { background: var(--cloud); border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  .ho-tekst-blok pre { background: var(--cloud); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; white-space: pre-wrap; margin: 6px 0 12px; }
  .ho-tekst-blok .kopieer { margin-top: 6px; }
  .vink { width: 18px; height: 18px; vertical-align: -3px; margin-right: 4px; accent-color: #116b4a; }
  .boom { background: var(--cloud); border-radius: 10px; padding: 14px; margin: 10px 0 6px; }
  .boom-rij { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--slate); padding: 6px 0; border-bottom: 1px solid var(--border); }
  .boom-vraag { padding-top: 10px; }
  .boom-vraag p { font-weight: 500; color: var(--navy-deep); margin-bottom: 10px; font-size: 16.5px; }
  .boom-uitkomst { margin-top: 12px; border-radius: 8px; padding: 12px 14px; }
  .boom-uitkomst.goed { background: var(--green-pale); color: #0d5a3d; }
  .boom-uitkomst.mis { background: var(--red-pale); color: var(--red); }
  .boom-uitkomst.half { background: var(--amber-pale); color: #7a4d00; }
  .boom-uitkomst b { font-size: 17px; }
  .sorteer-taak { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
  .sorteer .seg { display: grid; grid-template-columns: 1fr; width: 100%; }
  .sorteer .seg button { border-right: 0; border-bottom: 1px solid var(--border); text-align: left; padding: 9px 12px; }
  .sorteer .seg button:last-child { border-bottom: 0; }
  @media (min-width: 720px) { .sorteer .seg { grid-template-columns: repeat(3, 1fr); } .sorteer .seg button { border-bottom: 0; border-right: 1px solid var(--border); text-align: center; } .sorteer .seg button:last-child { border-right: 0; } }
  @media print {
    .kop, .status, .geen-print, .pres { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
    .kaart, .arrest { border: 0; padding: 0; }
    input[type=text], textarea { border: 0; border-bottom: 1px solid #999; border-radius: 0; padding: 4px 0; resize: none; }
  }
  @media (min-width: 720px) {
    main { padding: 28px 24px 80px; }
    .kaart { padding: 24px 28px; }
    .rij2 { grid-template-columns: 1fr 1fr; }
    .tellers { grid-template-columns: repeat(3, 1fr); }
    .naast { grid-template-columns: 1fr 1fr; }
    .ho-lijst { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 980px) {
    .tellers { grid-template-columns: repeat(6, 1fr); }
  }
</style>
</head>
<body>

<header class="kop">
  <div class="kop-in">
    <div class="kop-merk">Juridische AI-training · <b>Oefeningen</b></div>
    <div class="kop-rechts" id="kopRechts"></div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="app"></main>
<div class="status verborgen" id="status"></div>
<div class="pres verborgen" id="pres"></div>

<script>

  // pad: "kern.ChatGPT.antwoord" of "arresten.#id.naam"
  function pad(obj, p, maak) {
    var delen = p.split('.'), o = obj;
    for (var i = 0; i < delen.length - 1; i++) {
      var d = delen[i];
      if (d.charAt(0) === '#') {
        var id = d.slice(1), gevonden = null;
        for (var j = 0; j < o.length; j++) if (o[j].id === id) gevonden = o[j];
        if (!gevonden) return null;
        o = gevonden;
      } else {
        if (o[d] == null) { if (!maak) return null; o[d] = (delen[i + 1].charAt(0) === '#') ? [] : {}; }
        o = o[d];
      }
    }
    return { o: o, k: delen[delen.length - 1] };
  }
  function haal(obj, p) { var r = pad(obj, p, false); return r ? r.o[r.k] : undefined; }
  function zet(obj, p, v) { var r = pad(obj, p, true); if (r) r.o[r.k] = v; }

  // zelfde drieweg-samenvoeging als in n8n
  function isObj(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }
  function isIdArr(x) { return Array.isArray(x) && x.every(function (e) { return isObj(e) && e.id; }); }
  function perId(a) { var m = {}; a.forEach(function (e) { m[e.id] = e; }); return m; }
  function samen(b, l, c) {
    if (c === undefined) return l;
    if (l === undefined) return c;
    if (zelfde(l, b)) return c;
    if (zelfde(c, b)) return l;
    if (isObj(l) && isObj(c)) {
      var bb = isObj(b) ? b : {}, uit = {}, sleutels = {};
      Object.keys(c).concat(Object.keys(l)).forEach(function (k) { sleutels[k] = 1; });
      Object.keys(sleutels).forEach(function (k) { var v = samen(bb[k], l[k], c[k]); if (v !== undefined) uit[k] = v; });
      return uit;
    }
    if (isIdArr(l) && isIdArr(c)) {
      var bm = perId(isIdArr(b) ? b : []), lm = perId(l), cm = perId(c), lijst = [];
      var ids = c.map(function (e) { return e.id; }).concat(l.map(function (e) { return e.id; }).filter(function (id) { return !cm[id]; }));
      ids.forEach(function (id) {
        if (lm[id] && cm[id]) lijst.push(samen(bm[id], lm[id], cm[id]));
        else if (lm[id]) { if (!bm[id] || !zelfde(lm[id], bm[id])) lijst.push(lm[id]); }
        else if (cm[id]) { if (!bm[id] || !zelfde(cm[id], bm[id])) lijst.push(cm[id]); }
      });
      return lijst;
    }
    return l;
  }

  function kopieer(tekst, knop) {

  var verversTimer = null;

      var m = {}; (r.items || []).forEach(function (x) { m[x.sleutel] = x; });
      st.inhoud[prefix.slice(0, 3)] = m;

  function groepenVan(oef) {
    return ((st.overzicht && st.overzicht.groepen) || []).filter(function (g) { return g.oefening === oef; })
      .sort(function (a, b) { return (a.nr || 0) - (b.nr || 0); });
  }

  function telGo1(groepen) {
    var t = { totaal: 0, bestaatNiet: 0, datum: 0, instantie: 0, onderwerp: 0, deels: 0, klopt: 0, open: 0, perModel: {} };
    groepen.forEach(function (g) {
      (g.data.arresten || []).forEach(function (a) {
        if (!a.naam && !a.ecli) return;
        t.totaal++;
        var fout = oordeelArrest(a);
        if (fout.open) t.open++;
        if (fout.bestaatNiet) t.bestaatNiet++;
        if (fout.datum) t.datum++;
        if (fout.instantie) t.instantie++;
        if (fout.onderwerp) t.onderwerp++;
        if (fout.deels) t.deels++;
        if (fout.klopt) t.klopt++;
        Object.keys(a.door || {}).forEach(function (m) {
          if (!a.door[m]) return;
          var pm = t.perModel[m] || (t.perModel[m] = { genoemd: 0, fout: 0 });
          pm.genoemd++;
          if (fout.bestaatNiet || fout.datum || fout.instantie || fout.onderwerp || fout.deels) pm.fout++;
        });
      });
    });
    return t;
  }
  function oordeelArrest(a) {
    var o = {};
    if (!a.bestaat) { o.open = true; return o; }
    if (a.bestaat === 'nee') { o.bestaatNiet = true; return o; }
    if (a.datum === 'nee') o.datum = true;
    if (a.instantie === 'nee') o.instantie = true;
    if (a.onderwerp === 'nee') o.onderwerp = true;
    if (a.onderwerp === 'deels') o.deels = true;
    if (!o.datum && !o.instantie && a.onderwerp === 'ja') o.klopt = true;
    return o;
  }
  function tagsArrest(a) {
    var o = oordeelArrest(a), h = '';
    if (o.open) return '<span class="tag leeg">Nog niet nagetrokken</span>';
    if (o.bestaatNiet) return '<span class="tag mis">Bestaat niet</span>';
    if (o.klopt) h += '<span class="tag goed">Klopt</span>';
    if (o.datum) h += '<span class="tag mis">Verkeerde datum</span>';
    if (o.instantie) h += '<span class="tag mis">Verkeerde instantie</span>';
    if (o.onderwerp) h += '<span class="tag mis">Ander onderwerp</span>';
    if (o.deels) h += '<span class="tag half">Deels over dit onderwerp</span>';
    if (!h) h = '<span class="tag leeg">Bestaat</span>';

  function balkenModellen(t) {

        '<div class="klein" style="margin:-2px 0 6px">waarvan ' + pm.fout + ' met een fout</div>';

      '<div class="codeblok" style="margin-top:14px"><span class="url">forgexe.nl/oefeningen</span><span class="url">code</span><span class="code">' + esc(ed.code || '') + '</span></div>';

        '<span class="klein">' + (st.status.envelop ? 'Deelnemers kunnen nu hun envelop openen.' : 'Zet hem open op het moment dat John “Envelop open” zegt.') + '</span></div>';
    }

    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'oefeningen-' + st.editie + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    meld('Download gestart', 'ok');
  }
  st.sorteerToon = false;

  function hoHaal(p) { return haal(st.ho, p) || ''; }
  function hoVeld(p, label, opts) {
    opts = opts || {};
    var id = 'h-' + p.replace(/[^a-zA-Z0-9]/g, '-'), v = hoHaal(p);
    var veld = opts.regel
      ? '<input type="text" id="' + id + '" data-ho="' + p + '" value="' + esc(v) + '"' + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + '>'
      : '<textarea id="' + id + '" data-ho="' + p + '"' + (opts.groot ? ' class="groot"' : '') + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '') + '>' + esc(v) + '</textarea>';
    return (label ? '<label class="veld" for="' + id + '">' + label + '</label>' : '') + veld;
  }

  function laadHandouts() {
    app.innerHTML = '<div class="kaart"><p class="uitleg">Hand-outs laden…</p></div>';
    var body = st.rol === 'trainer' ? { actie: 'inhoud', prefix: 'ho-' } : { actie: 'handouts' };
    // hand-out 7 (sorteerkaarten) vervalt sinds 4-11-2026: blok 9 is een quiz op het scherm
    post(body, function (r) { st.handouts = (r.items || []).filter(function (x) { return x.sleutel !== 'ho-07'; }); tekenHandouts(); },
      function (f) { app.innerHTML = '<div class="kaart"><div class="fout">' + esc(f) + '</div></div>'; });
  }

  // blok 7: de bestanden van het fictieve kantoor om in een project te zetten (staan in /downloads/kennisbank-maasdal/)
  var KB = [
    ['Projectinstructie.txt', 'Projectinstructie', 'plakken in het instructieveld'],
    ['Huisstijl.docx', 'Huisstijl', 'uploaden'],
    ['Standaardclausules.docx', 'Standaardclausules', 'uploaden, met de AI-clausule'],
    ['Model-opdrachtbevestiging.docx', 'Model opdrachtbevestiging', 'uploaden'],
    ['Keuzekaart.docx', 'Keuzekaart', 'uploaden']
  ];
  function htmlKennisbank() {
    var pad = '/downloads/kennisbank-maasdal/';
    return '<div class="kaart geen-print"><div class="stap">Blok 7 · Je eigen kennisbank</div><h2>Kennisbank Maasdal Advocaten</h2>' +
      '<p class="uitleg">Maasdal Advocaten is een fictief kantoor. Maak een nieuw project, plak de projectinstructie in het instructieveld en upload de vier documenten.</p>' +
      '<p style="margin:12px 0"><a class="knop" href="' + pad + 'Kennisbank-Maasdal-Advocaten.zip" download>Alles downloaden (zip)</a></p><div class="ho-lijst">' +
      KB.map(function (k) {
        return '<a class="ho-kaart" href="' + pad + k[0] + '" download><span class="ho-tekst"><b>' + k[1] + '</b><span>' + k[2] + '</span></span><span class="tag leeg">' + k[0].split('.').pop() + '</span></a>';
      }).join('') + '</div></div>';
  }

  function tekenHandouts() {
    if (!st.handouts) return laadHandouts();
    var open = st.hoOpen && st.handouts.filter(function (x) { return x.sleutel === st.hoOpen; })[0];
    if (!open) {
      var h = (st.rol === 'trainer' ? htmlHoIngevuld() : '') + '<div class="kaart"><div class="stap">Hand-outs</div><h2>Alles van vandaag, om te bewaren</h2>' +
        '<p class="uitleg">' + (st.rol === 'deelnemer' ? 'Wat je hier invult, wordt op jouw naam bewaard. Druk het af of bewaar het als PDF als je het zelf wilt houden.' : 'Wat je hier als trainer invult, blijft alleen in deze browser staan.') + '</p></div>' + htmlKennisbank() + '<div class="ho-lijst">';
      st.handouts.forEach(function (x) {
        var nr = Number(x.sleutel.slice(3)), info = HO_INFO[x.sleutel] || {};
        h += '<button class="ho-kaart" data-hoopen="' + x.sleutel + '"><span class="ho-nr">' + nr + '</span><span class="ho-tekst"><b>' + esc(x.titel) + '</b>' +
          (info.kort ? '<span>' + esc(info.kort) + '</span>' : '') + '</span>' + (info.soort ? '<span class="tag leeg">' + info.soort + '</span>' : '') + '</button>';
      });
      app.innerHTML = h + '</div>';
      return;
    }
    var nr = Number(open.sleutel.slice(3));
    var h2 = '<div class="kaart"><div class="balk geen-print" style="justify-content:space-between;margin-bottom:10px"><button class="weg" data-hoterug="1">← Alle hand-outs</button>' +
      '<button class="knop twee klein" data-print="1">Afdrukken of bewaren als PDF</button></div>' +
      '<div class="stap">Hand-out ' + nr + '</div><h2>' + esc(open.titel) + '</h2>';
    if (open.sleutel === 'ho-03') h2 += htmlBoom();
    if (open.sleutel === 'ho-07') h2 += htmlSorteer();
    h2 += '<div class="env ho-tekst-blok">' + open.html + '</div>';
    if (open.sleutel === 'ho-01') {
      h2 += '<h3>Voor jouw kantoor of afdeling</h3>' + hoVeld('ho1.kantoor', 'Kantoor of afdeling', { regel: true }) +
        '<label class="veld">Bij ons toegestaan</label>';
      for (var i = 1; i <= 4; i++) {
        h2 += '<div class="arrest"><div class="rij2"><div>' + hoVeld('ho1.r' + i + '.tool', 'Tool en versie', { regel: true, ph: i === 1 ? 'bijv. Claude Team' : '' }) + '</div>' +
          '<div>' + hoVeld('ho1.r' + i + '.werk', 'Voor welk werk', { regel: true }) + '</div></div>' + hoVeld('ho1.r' + i + '.niet', 'Niet voor', { regel: true }) + '</div>';
      }
      h2 += '<h3>Gaat het mis?</h3>' + hoVeld('ho1.melden', 'Direct melden bij', { regel: true }) +
        '<p class="klein" style="margin-top:6px">Datalek registreren, risico inschatten (meldplicht binnen 72 uur), cliënt informeren.</p>';
    }
    if (open.sleutel === 'ho-04') {
      h2 += '<h3>Jullie eigen clausule</h3><p class="uitleg">Schrijf in tweetallen je eigen versie. Begin gerust met ons concept en pas het aan.</p>' +
        '<p class="geen-print" style="margin-bottom:8px"><button class="knop twee klein" data-hoconcept="1">Begin met het concept</button> <button class="kopieer" data-hokopieer="ho4.clausule">Kopieer</button></p>' +
        hoVeld('ho4.clausule', '', { groot: true, ph: 'Gebruik van kunstmatige intelligentie\n\n1. …' });
    }
    if (open.sleutel === 'ho-08') {
      for (var j = 1; j <= 3; j++) {
        h2 += '<div class="arrest"><div class="arrest-kop"><b>Taak ' + j + '</b></div>' + hoVeld('ho8.t' + j + '.taak', 'Taak', { regel: true, ph: j === 1 ? 'bijv. de eerste versie van een opdrachtbevestiging' : '' }) +
          '<div class="rij2"><div>' + hoVeld('ho8.t' + j + '.nu', 'Hoe vaak, en hoeveel tijd nu', { regel: true }) + '</div><div>' + hoVeld('ho8.t' + j + '.tool', 'Gereedschap (tool en versie)', { regel: true }) + '</div></div>' +
          hoVeld('ho8.t' + j + '.prompt', 'Mijn prompt (kort)') + hoVeld('ho8.t' + j + '.controle', 'Mijn controle', { regel: true }) + '</div>';
      }
      h2 += hoVeld('ho8.terug', 'Over vier weken kijk ik terug: hoeveel tijd heeft het opgeleverd?', { regel: true });
    }
    app.innerHTML = h2 + '</div>';
    // afvinkbare checklist en kopieerknoppen bij de promptblokken
    if (open.sleutel === 'ho-02') {
      Array.prototype.forEach.call(app.querySelectorAll('.ho-tekst-blok li'), function (li, k) {
        li.innerHTML = li.innerHTML.replace('☐', '<input type="checkbox" class="vink" data-vink="' + k + '"' + (st.ho['vink' + k] ? ' checked' : '') + '>');
      });
    }
    Array.prototype.forEach.call(app.querySelectorAll('.ho-tekst-blok pre'), function (pre, k) {
      var knop = document.createElement('button');
      knop.className = 'kopieer geen-print'; knop.textContent = 'Kopieer'; knop.setAttribute('data-hokopieerpre', k);
      pre.parentNode.insertBefore(knop, pre);
    });
  }

  function htmlBoom() {
    var h = '<div class="boom">', stap = 'q1';
    st.boom.forEach(function (antw) {
      h += '<div class="boom-rij"><span>' + esc(BOOM[stap].v) + '</span><span class="tag ' + (antw === 'ja' ? 'half' : 'leeg') + '">' + (antw === 'ja' ? 'Ja' : 'Nee') + '</span></div>';
      stap = BOOM[stap][antw];
    });
    var b = BOOM[stap];
    if (b.v) h += '<div class="boom-vraag"><p>' + esc(b.v) + '</p><div class="balk"><button class="knop klein" data-boom="ja">Ja</button><button class="knop twee klein" data-boom="nee">Nee</button></div></div>';
    else h += '<div class="boom-uitkomst ' + b.soort + '"><b>' + esc(b.t) + '</b><p>' + esc(b.s) + '</p></div>';
    if (st.boom.length) h += '<p style="margin-top:10px"><button class="weg" data-boom="opnieuw">Opnieuw, met een ander dossier</button></p>';
    return h + '</div>';
  }

  function htmlSorteer() {
    var keuze = st.ho.sorteer || {}, goed = 0, gedaan = 0;
    var h = '<p class="uitleg">Leg elke taak op een stapel. Daarna kun je de verwachte stapel tonen.</p><div class="sorteer">';
    KAARTEN.forEach(function (k, i) {
      var v = keuze['k' + i] || '';
      if (v) gedaan++;
      if (v && v === k[1]) goed++;
      h += '<div class="arrest"><div class="sorteer-taak"><span class="ho-nr">' + (i + 1) + '</span><span>' + esc(k[0]) + '</span></div><div class="seg">' +
        ['p', 'a', 'n'].map(function (s) {
          var cls = v === s ? 'aan ' + (st.sorteerToon ? (s === k[1] ? 'goed' : 'mis') : 'goed') : '';
          return '<button type="button" class="' + cls + '" data-sorteer="' + i + '|' + s + '">' + STAPEL[s] + '</button>';
        }).join('') + '</div>' +
        (st.sorteerToon ? '<p class="klein" style="margin-top:6px">Verwacht: <b>' + esc(k[2] || STAPEL[k[1]]) + '</b></p>' : '') + '</div>';
    });
    h += '</div><p class="geen-print" style="margin:14px 0"><button class="knop twee klein" data-sorteertoon="1">' + (st.sorteerToon ? 'Verberg de verwachte stapel' : 'Toon de verwachte stapel') + '</button>' +
      (st.sorteerToon && gedaan ? ' <span class="klein">' + goed + ' van de ' + gedaan + ' op dezelfde stapel als wij.</span>' : '') + '</p>';
    return h;
  }

  document.addEventListener('input', function (e) {
    var p = e.target.getAttribute && e.target.getAttribute('data-ho');
    if (!p) return;
    zet(st.ho, p, e.target.value); hoPlan();
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-vink');
    if (k == null) return;
    st.ho['vink' + k] = e.target.checked; hoPlan();
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('button') : null;
    if (!el) return;
    if (el.hasAttribute('data-hoopen')) { st.hoOpen = el.getAttribute('data-hoopen'); st.boom = []; st.sorteerToon = false; tekenHandouts(); window.scrollTo(0, 0); }
    else if (el.hasAttribute('data-hoterug')) { st.hoOpen = null; tekenHandouts(); window.scrollTo(0, 0); }
    else if (el.hasAttribute('data-print')) window.print();
    else if (el.hasAttribute('data-boom')) {
      var w = el.getAttribute('data-boom');
      if (w === 'opnieuw') st.boom = []; else st.boom.push(w);
      tekenHandouts();
    }
    else if (el.hasAttribute('data-sorteer')) {
      var s = el.getAttribute('data-sorteer').split('|');
      st.ho.sorteer = st.ho.sorteer || {};
      st.ho.sorteer['k' + s[0]] = st.ho.sorteer['k' + s[0]] === s[1] ? '' : s[1];
      hoPlan(); tekenHandouts();
    }
    else if (el.hasAttribute('data-sorteertoon')) { st.sorteerToon = !st.sorteerToon; tekenHandouts(); }
    else if (el.hasAttribute('data-hoconcept')) {
      var bq = app.querySelector('.ho-tekst-blok blockquote');
      if (!bq) return;
      if (hoHaal('ho4.clausule') && !confirm('Je eigen tekst vervangen door het concept?')) return;
      zet(st.ho, 'ho4.clausule', bq.innerText.trim()); hoPlan(); tekenHandouts();
    }
    else if (el.hasAttribute('data-hokopieer')) kopieer(hoHaal(el.getAttribute('data-hokopieer')), el);
    else if (el.hasAttribute('data-hokopieerpre')) {
      var pre = app.querySelectorAll('.ho-tekst-blok pre')[Number(el.getAttribute('data-hokopieerpre'))];
      if (pre) kopieer(pre.innerText, el);
    }
  });

  /* ---------- gebeurtenissen ---------- */
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'loginForm') {
      e.preventDefault();
      var code = document.getElementById('lCode').value.trim();
      if (code) loginDeelnemer(code);
    }
    if (e.target.id === 'naamForm') {
      e.preventDefault();
      var nm = document.getElementById('lNaam').value.trim();
      if (nm) loginDeelnemer(st.code, false, nm);
    }
    if (e.target.id === 'trainerForm') {
      e.preventDefault();
      loginTrainer(document.getElementById('lWw').value);
    }
  });

  document.addEventListener('input', function (e) {
    var p = e.target.getAttribute && e.target.getAttribute('data-pad');
    if (!p || st.rol !== 'deelnemer') return;
    zet(st.data[st.oef], p, e.target.value);
    gewijzigd();
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'kiesEditie') {
      st.editie = e.target.value; bewaar('trainer', { ww: st.wachtwoord, editie: st.editie });
      st.overzicht = null; laadOverzicht(true);
    }
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('button, a') : null;
    if (!el) return;
    var a = el.getAttribute('data-actie');
    var d = st.data[st.oef];

    if (el.hasAttribute('data-pres')) {
      var stap = Number(el.getAttribute('data-pres'));
      if (stap === 0) sluitPres(); else { st.presIndex += stap; tekenPres(); }
      return;
    }
    if (el.hasAttribute('data-tab')) {
      if (opslaanTimer && st.rol === 'deelnemer') { clearTimeout(opslaanTimer); opslaanTimer = null; opslaan(); }
      st.oef = el.getAttribute('data-tab'); st.envelop = null; tekenKop();
      if (st.oef === 'ho') tekenHandouts(); else if (st.rol === 'trainer') tekenTrainer(); else openOefening();
      return;
    }
    if (el.hasAttribute('data-naam')) { loginDeelnemer(st.code, false, el.getAttribute('data-naam')); return; }
    if (el.hasAttribute('data-kopieer')) { kopieer(el.getAttribute('data-kopieer'), el); return; }
    if (el.hasAttribute('data-stapnaar')) {
      st.stap[st.oef] = Number(el.getAttribute('data-stapnaar'));
      bewaar('stap-' + st.editie + '-' + st.oef + '-' + st.groep[st.oef], st.stap[st.oef]);
      teken(); window.scrollTo(0, 0); return;
    }
    if (el.hasAttribute('data-zet')) {
      var p = el.getAttribute('data-zet'), w = el.getAttribute('data-waarde');
      zet(d, p, haal(d, p) === w && p !== 'gebied' && p !== 'casus' ? '' : w);
      if (p === 'gebied') st.envelop = null;
      gewijzigd(); teken(); return;
    }
    if (el.hasAttribute('data-wissel')) {
      var pw = el.getAttribute('data-wissel');
      zet(d, pw, !haal(d, pw)); gewijzigd(); teken(); return;
    }
    if (el.hasAttribute('data-weg')) {
      if (!confirm('Dit arrest verwijderen?')) return;
      var id = el.getAttribute('data-weg');
      d.arresten = (d.arresten || []).filter(function (x) { return x.id !== id; });
      gewijzigd(); teken(); return;
    }
    if (el.hasAttribute('data-sleutel')) {
      var gk = el.getAttribute('data-sleutel'); st.toonSleutel[gk] = !st.toonSleutel[gk]; tekenTrainer(); return;
    }
    if (el.hasAttribute('data-verwijder')) {
      var dl = el.getAttribute('data-verwijder').split('|');
      if (!confirm('Alles van ' + (dl[2] || 'deze deelnemer') + ' in deze oefening wissen? Dit kun je niet terugdraaien.')) return;
      post({ actie: 'verwijder', oefening: dl[0], groep: dl[1] }, function () { laadOverzicht(false); }, function (f) { alert(f); });
      return;
    }

    if (!a) return;
    e.preventDefault();
    if (a === 'naarTrainer') tekenLogin(true);
    else if (a === 'naarDeelnemer') tekenLogin(false);
    else if (a === 'uitloggen') {
      wis('sessie'); wis('trainer'); clearInterval(verversTimer);
      st.rol = null; st.oef = 'go1'; st.wachtwoord = ''; st.nr = null; st.naam = ''; st.ho = {}; st.hoBasis = {}; st.groep = { go1: '', go2: '' }; st.data = { go1: {}, go2: {} }; st.basis = { go1: {}, go2: {} }; st.envelop = null; st.stap = {};
      tekenLogin(false);
    }
    else if (a === 'herlaad') openOefening();
    else if (a === 'nieuwArrest') {
      d.arresten = d.arresten || [];
      d.arresten.push({ id: nieuwId() });
      gewijzigd(); teken();
      var velden = app.querySelectorAll('.arrest input[type=text]');
      if (velden.length) { var laatste = app.querySelectorAll('.arrest'); laatste = laatste[laatste.length - 1]; var inp = laatste.querySelector('input'); if (inp) inp.focus(); }
    }
    else if (a === 'envelop') {
      el.disabled = true; el.textContent = 'Even kijken…';
      var gebied = d.gebied;
      post({ actie: 'envelop', gebied: gebied }, function (r) {
        st.envelop = r.open ? { gebied: gebied, items: r.items } : { dicht: true };
        teken();
        var env = document.getElementById('envelop'); if (env && r.open) env.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, function (f) { el.disabled = false; el.textContent = 'Open de envelop'; meld(f, 'mis'); });
    }
    else if (a === 'envelopWissel') {
      var nieuw = !st.status.envelop;
      post({ actie: 'zet', data: { envelop: nieuw } }, function (r) { st.status = r.status; tekenTrainer(); meld(nieuw ? 'Envelop staat open' : 'Envelop is weer dicht', 'ok'); }, function (f) { meld(f, 'mis'); });
    }
    else if (a === 'ververs') laadOverzicht(false);
    else if (a === 'presenteer') openPres();
    else if (a === 'export') exporteer();
  });

  document.addEventListener('keydown', function (e) {
    if (document.getElementById('pres').classList.contains('verborgen')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { st.presIndex++; tekenPres(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { st.presIndex--; tekenPres(); e.preventDefault(); }
    else if (e.key === 'Escape') sluitPres();
  });

  /* ---------- start ---------- */
  var t = lees('trainer'), s = lees('sessie');
  if (/[?&]trainer\b/.test(location.search) && !t) tekenLogin(true);
  else if (t && t.ww) { app.innerHTML = '<div class="kaart"><p class="uitleg">Inloggen…</p></div>'; loginTrainer(t.ww, true); }
  else if (s && s.code && s.naam) { app.innerHTML = '<div class="kaart"><p class="uitleg">Inloggen…</p></div>'; st.code = s.code; loginDeelnemer(s.code, true, s.naam); }
  else {
    var m = location.search.match(/[?&]code=([^&]+)/);
    if (m) st.code = decodeURIComponent(m[1]);
    tekenLogin(false);
  }
})();
</script>
</body>
</html>
